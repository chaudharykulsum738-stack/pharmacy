<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Receipt #{{ sale.sale_id }}</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'IBM Plex Mono', monospace; max-width: 380px; margin: 30px auto; color: #16241f; font-size: 13px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; color: #0b3d3f; margin-bottom: 2px; }
  .sub { color: #5c7a78; font-size: 11px; margin-bottom: 20px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #dbe7e4; }
  .row.total { font-weight: 700; border-bottom: none; border-top: 2px solid #16241f; margin-top: 8px; padding-top: 10px; }
  .print-btn {
    margin-top: 24px; width: 100%; padding: 10px; background: #0f5257; color: white;
    border: none; border-radius: 6px; font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    cursor: pointer; font-size: 13px;
  }
  @media print { .print-btn { display: none; } }
</style>
</head>
<body>
  <h1>Smart Pharmacy</h1>
  <div class="sub">Sale Receipt #{{ sale.sale_id }} — {{ sale.sale_date }}</div>

  <div class="row"><span>Customer</span><span>{{ sale.customer_name }}</span></div>
  <div class="row"><span>Contact</span><span>{{ sale.contact_number }}</span></div>
  <div class="row"><span>Medicine</span><span>{{ sale.medicine_name }}</span></div>
  <div class="row"><span>Dosage</span><span>{{ sale.dosage_strength or '-' }}</span></div>
  <div class="row total"><span>Quantity</span><span>{{ sale.quantity_sold }} unit(s)</span></div>

  <button class="print-btn" onclick="window.print()">Print Receipt</button>
</body>
</html>
